<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>MODEX.UZ Operator</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      font-family:Arial,sans-serif;
      background:#f5f5fa;
    }

    .box{
      width:100%;
      max-width:420px;
      background:white;
      padding:28px;
      border-radius:22px;
      box-shadow:0 15px 40px rgba(0,0,0,.08);
    }

    .logo{
      font-size:26px;
      font-weight:900;
      margin-bottom:25px;
    }

    .logo span{
      color:#713cf0;
    }

    h1{
      margin:0 0 20px;
    }

    label{
      display:block;
      margin-top:14px;
      font-size:13px;
      font-weight:700;
    }

    input{
      width:100%;
      height:48px;
      margin-top:6px;
      padding:0 12px;
      border:1px solid #ddd;
      border-radius:12px;
      outline:none;
    }

    input:focus{
      border-color:#713cf0;
    }

    button{
      width:100%;
      height:49px;
      margin-top:20px;
      border:0;
      border-radius:12px;
      background:#713cf0;
      color:white;
      font-weight:800;
      cursor:pointer;
    }

    button:disabled{
      opacity:.6;
    }

    #message{
      min-height:20px;
      margin-top:12px;
      font-size:13px;
      font-weight:700;
    }

    .error{
      color:#d32f2f;
    }

    .success{
      color:#159759;
    }

    .info{
      color:#555;
    }

    #debug{
      margin-top:14px;
      padding:10px;
      background:#f5f5f8;
      border-radius:10px;
      font-size:11px;
      color:#666;
      word-break:break-word;
    }
  </style>
</head>

<body>

<div class="box">

  <div class="logo">
    MODEX<span>.UZ</span>
  </div>

  <h1>Operator kirish</h1>

  <form id="loginForm">

    <label>
      Email

      <input
        id="email"
        type="email"
        required
      >
    </label>

    <label>
      Parol

      <input
        id="password"
        type="password"
        required
      >
    </label>

    <button
      id="loginBtn"
      type="submit"
    >
      Kirish
    </button>

  </form>

  <div
    id="message"
    class="info"
  >
    Sahifa tayyor.
  </div>

  <div id="debug">
    Config tekshirilmoqda...
  </div>

</div>


<script src="./config.js?v=7777"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const form =
    document.getElementById("loginForm");

  const emailInput =
    document.getElementById("email");

  const passwordInput =
    document.getElementById("password");

  const button =
    document.getElementById("loginBtn");

  const message =
    document.getElementById("message");

  const debug =
    document.getElementById("debug");


  function setMessage(text, type) {

    message.textContent =
      text;

    message.className =
      type || "info";
  }


  const config =
    window.MODEX_CONFIG || {};


  const supabaseUrl =
    config.SUPABASE_URL || "";


  const supabaseKey =
    config.SUPABASE_KEY || "";


  if (
    !supabaseUrl ||
    !supabaseKey
  ) {

    debug.textContent =
      "❌ config.js ishlamadi yoki SUPABASE_URL / SUPABASE_KEY topilmadi.";

    setMessage(
      "Config xatosi.",
      "error"
    );

  } else {

    debug.textContent =
      "✅ config.js yuklandi.";

  }


  form.addEventListener(
    "submit",
    async function (event) {

      event.preventDefault();


      setMessage(
        "Kirilmoqda...",
        "info"
      );


      button.disabled =
        true;


      try {

        if (
          !supabaseUrl ||
          !supabaseKey
        ) {

          throw new Error(
            "config.js ishlamayapti."
          );

        }


        const email =
          emailInput.value.trim();


        const password =
          passwordInput.value;


        const response =
          await fetch(
            supabaseUrl +
            "/auth/v1/token?grant_type=password",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",

                "apikey":
                  supabaseKey
              },

              body:
                JSON.stringify({
                  email: email,
                  password: password
                })
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error_description ||
            data.message ||
            data.error ||
            "Login xatosi"
          );

        }


        if (!data.access_token) {

          throw new Error(
            "Access token kelmadi."
          );

        }


        sessionStorage.setItem(
          "modex_operator_token",
          data.access_token
        );


        setMessage(
          "✅ LOGIN ISHLADI!",
          "success"
        );


        debug.textContent =
          "✅ Supabase Auth ishladi. Keyingi bosqichda operator panelni ochamiz.";


      } catch (error) {

        console.error(error);


        setMessage(
          "❌ " + error.message,
          "error"
        );


        debug.textContent =
          "Login so‘rovida xato chiqdi.";

      } finally {

        button.disabled =
          false;

      }

    }
  );

});
</script>

</body>
</html>
