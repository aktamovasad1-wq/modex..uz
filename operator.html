<!doctype html>
<html lang="uz">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>MODEX.UZ — Operator Panel</title>

  <link
    rel="stylesheet"
    href="./style.css?v=20260815-0500"
  >
</head>

<body>


<!-- =========================
     LOGIN
========================= -->

<section
  id="operatorLoginView"
  class="login-wrap"
>

  <div class="login-box">

    <span class="market-category">
      MODEX.UZ
    </span>

    <h2>
      Operator panelga kirish
    </h2>


    <form id="operatorLoginForm">

      <label>
        Email

        <input
          id="operatorEmail"
          type="email"
          autocomplete="email"
          placeholder="operator@email.com"
          required
        >
      </label>


      <label>
        Parol

        <input
          id="operatorPassword"
          type="password"
          autocomplete="current-password"
          placeholder="Parol"
          required
        >
      </label>


      <button
        type="submit"
        class="main-btn full-btn"
      >
        Kirish
      </button>


      <p
        id="operatorLoginMessage"
        class="form-message"
      ></p>

    </form>

  </div>

</section>


<!-- =========================
     OPERATOR PANEL
========================= -->

<section
  id="operatorView"
  class="hidden"
>

  <div class="admin-shell">

    <div class="admin-head">

      <div>

        <span class="market-category">
          MODEX.UZ
        </span>

        <h1>
          Operator Panel
        </h1>

        <p id="operatorUserName">
          Operator
        </p>

      </div>


      <div class="admin-top-actions">

        <button
          id="operatorLogoutBtn"
          class="small-btn"
          type="button"
        >
          Chiqish
        </button>

      </div>

    </div>


    <section class="panel">

      <div class="panel-title">

        <div>

          <span class="market-category">
            TEST
          </span>

          <h2>
            Panel ishladi ✅
          </h2>

        </div>

      </div>


      <p style="color:#777;line-height:1.6;">
        Agar shu yozuvni ko‘rsang, operator login to‘g‘ri ishlayapti.
        Keyin buyurtmalar, telefon, status va zayavka modalini qo‘shamiz.
      </p>

    </section>

  </div>

</section>


<!-- =========================
     SCRIPT
========================= -->

<script src="./config.js?v=20260815-0500"></script>
<script src="./operator.js?v=20260815-0500"></script>

</body>
</html>
