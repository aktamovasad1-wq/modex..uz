<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modex.uz — Operator</title><link rel="stylesheet" href="style.css"></head><body>
<div id="operatorLogin" class="login-wrap"><form id="operatorLoginForm" class="login-box"><p class="eyebrow">MODEX.UZ OPERATOR</p><h1>Kirish</h1><label>Email<input id="opEmail" type="email" required></label><label>Parol<input id="opPassword" type="password" required></label><button class="btn primary full">Kirish</button><p id="opLoginMessage" class="form-message"></p></form></div>
<div id="operatorView" class="hidden"><header class="topbar"><a class="brand" href="index.html">MODEX<span>.UZ</span></a><div class="admin-actions"><button id="opRefresh" class="btn secondary">Yangilash</button><button id="opLogout" class="btn secondary">Chiqish</button></div></header><main class="admin-shell"><div class="admin-head"><div><p class="eyebrow">OPERATOR PANEL</p><h2>Zayavkalar</h2></div><span id="opEmailView" class="muted"></span></div><div class="stats-row"><div class="stat"><b id="statNew">0</b><span>Yangi</span></div><div class="stat"><b id="statCalled">0</b><span>Gaplashildi</span></div><div class="stat"><b id="statConfirmed">0</b><span>Tasdiqlandi</span></div></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>№</th><th>Vaqt</th><th>Mijoz</th><th>Telefon</th><th>Mahsulot</th><th>Holat</th><th>Amal</th></tr></thead><tbody id="operatorOrders"></tbody></table></div><p id="operatorMessage" class="form-message"></p></section><section class="panel support-panel"><h2>Yordam murojaatlari</h2><div id="supportList" class="support-list"></div></section></main></div>
<dialog id="orderEditDialog"><form id="orderEditForm" class="order-form"><button class="close" type="button" id="closeOrderEdit">×</button><p class="eyebrow">ZAYAVKA</p><h3 id="editOrderTitle">Buyurtma</h3><input type="hidden" id="editId"><label>Ism<input id="editName" required></label><label>Familiya<input id="editSurname"></label><label>Telefon<input id="editPhone" required></label><label>Viloyat / shahar<input id="editRegion"></label><label>Yetkazib berish manzili<textarea id="editAddress"></textarea></label><label>Izoh<textarea id="editNote"></textarea></label><label>Status<select id="editStatus"><option value="new">Yangi</option><option value="called">Gaplashildi</option><option value="confirmed">Tasdiqlandi</option><option value="cancelled">Bekor qilindi</option><option value="shipped">Jo‘natildi</option><option value="done">Yakunlandi</option></select></label><button class="btn primary full">Saqlash</button><button class="btn secondary full" type="button" id="printQrBtn">QR etiketka</button><p id="editMessage" class="form-message"></p></form></dialog>
<div id="printArea" class="print-area"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="config.js"></script><script src="operator.js"></script></body></html>
