<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>MODEX.UZ Admin</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      font-family:Arial,sans-serif;
      background:#f5f5fa;
    }

    .box{
      width:100%;
      max-width:430px;
      background:#fff;
      padding:28px;
      border-radius:22px;
      box-shadow:0 15px 40px rgba(0,0,0,.08);
    }

    .logo{
      font-size:26px;
      font-weight:900;
      margin-bottom:7px;
    }

    .logo span{
      color:#713cf0;
    }

    .label{
      display:inline-block;
      font-size:10px;
      font-weight:900;
      letter-spacing:.12em;
      color:#713cf0;
      margin-bottom:15px;
    }

    h1{
      margin:0 0 8px;
    }

    p{
      color:#777;
      line-height:1.5;
    }

    label{
      display:block;
      margin-top:14px;
      font-size:13px;
      font-weight:700;
    }

    input{
      width:100%;
      height:48px;
      margin-top:6px;
      padding:0 12px;
      border:1px solid #ddd;
      border-radius:12px;
      outline:none;
    }

    input:focus{
      border-color:#713cf0;
    }

    button{
      width:100%;
      height:49px;
      margin-top:20px;
      border:0;
      border-radius:12px;
      background:#713cf0;
      color:#fff;
      font-weight:800;
      cursor:pointer;
    }

    button:disabled{
      opacity:.6;
    }

    #message{
      min-height:20px;
      margin-top:12px;
      font-size:13px;
      font-weight:700;
    }

    .error{
      color:#d32f2f;
    }

    .success{
      color:#159759;
    }

    .info{
      color:#555;
    }

    #debug{
      margin-top:14px;
      padding:10px;
      background:#f5f5f8;
      border-radius:10px;
      font-size:11px;
      color:#666;
      word-break:break-word;
    }
  </style>
</head>

<body>

<div class="box">

  <div class="logo">
    MODEX<span>.UZ</span>
  </div>

  <span class="label">
    ADMIN PANEL
  </span>

  <h1>Admin kirish</h1>

  <p>
    Admin hisobingiz bilan kiring.
  </p>

  <form id="loginForm">

    <label>
      Email

      <input
        id="email"
        type="email"
        required
      >
    </label>

    <label>
      Parol

      <input
        id="password"
        type="password"
        required
      >
    </label>

    <button
      id="loginBtn"
      type="submit"
    >
      Kirish
    </button>

  </form>

  <div
    id="message"
    class="info"
  >
    Sahifa tayyor.
  </div>

  <div id="debug">
    Config tekshirilmoqda...
  </div>

</div>

<script src="./config.js?v=9900"></script>

<script>
document.addEventListener("DOMContentLoaded", function(){

  const form =
    document.getElementById("loginForm");

  const emailInput =
    document.getElementById("email");

  const passwordInput =
    document.getElementById("password");

  const button =
    document.getElementById("loginBtn");

  const message =
    document.getElementById("message");

  const debug =
    document.getElementById("debug");


  function setMessage(text, type){

    message.textContent = text;

    message.className =
      type || "info";
  }


  const config =
    window.MODEX_CONFIG || {};


  const supabaseUrl =
    config.SUPABASE_URL || "";


  const supabaseKey =
    config.SUPABASE_KEY || "";


  if(
    !supabaseUrl ||
    !supabaseKey
  ){

    debug.textContent =
      "❌ config.js ishlamadi.";

    setMessage(
      "Config xatosi.",
      "error"
    );

  }else{

    debug.textContent =
      "✅ config.js yuklandi.";
  }


  form.addEventListener(
    "submit",
    async function(event){

      event.preventDefault();


      setMessage(
        "Kirilmoqda...",
        "info"
      );


      button.disabled =
        true;


      try{

        const email =
          emailInput.value.trim();


        const password =
          passwordInput.value;


        const authResponse =
          await fetch(
            supabaseUrl +
            "/auth/v1/token?grant_type=password",
            {
              method:"POST",

              headers:{
                "Content-Type":
                  "application/json",

                "apikey":
                  supabaseKey
              },

              body:
                JSON.stringify({
                  email:email,
                  password:password
                })
            }
          );


        const authData =
          await authResponse.json();


        if(!authResponse.ok){

          throw new Error(
            authData.error_description ||
            authData.message ||
            authData.error ||
            "Login xatosi"
          );
        }


        if(!authData.access_token){

          throw new Error(
            "Access token kelmadi."
          );
        }


        const userResponse =
          await fetch(
            supabaseUrl +
            "/auth/v1/user",
            {
              headers:{
                "apikey":
                  supabaseKey,

                "Authorization":
                  "Bearer " +
                  authData.access_token
              }
            }
          );


        const user =
          await userResponse.json();


        if(
          !userResponse.ok ||
          !user.id
        ){

          throw new Error(
            "Admin foydalanuvchisi aniqlanmadi."
          );
        }


        const profileResponse =
          await fetch(
            supabaseUrl +
            "/rest/v1/profiles?id=eq." +
            encodeURIComponent(user.id) +
            "&select=id,name,role,active",
            {
              headers:{
                "apikey":
                  supabaseKey,

                "Authorization":
                  "Bearer " +
                  authData.access_token
              }
            }
          );


        const profiles =
          await profileResponse.json();


        if(!profileResponse.ok){

          throw new Error(
            profiles.message ||
            "Profilni tekshirib bo‘lmadi."
          );
        }


        const profile =
          Array.isArray(profiles)
            ? profiles[0]
            : null;


        if(!profile){

          throw new Error(
            "Admin profili topilmadi."
          );
        }


        if(profile.role !== "admin"){

          throw new Error(
            "Bu hisob admin emas."
          );
        }


        if(profile.active !== true){

          throw new Error(
            "Admin bloklangan."
          );
        }


        sessionStorage.setItem(
          "modex_admin_token",
          authData.access_token
        );


        setMessage(
          "✅ ADMIN LOGIN ISHLADI!",
          "success"
        );


        debug.textContent =
          "✅ Auth + admin profil tekshirildi.";


      }catch(error){

        console.error(error);


        sessionStorage.removeItem(
          "modex_admin_token"
        );


        setMessage(
          "❌ " + error.message,
          "error"
        );


        debug.textContent =
          "Login tekshiruvida xato chiqdi.";


      }finally{

        button.disabled =
          false;
      }
    }
  );

});
</script>

</body>
</html>
